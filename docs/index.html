<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a01212">
<meta name="description" content="央视《新闻联播》+ 央视财经《经济信息联播》每日摘要：要点归纳、分类浏览、往期归类回看，每天自动更新。">
<title>央视新闻 · 每日摘要（新闻联播 + 央视财经）</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23a01212'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='serif' font-weight='bold'%3E闻%3C/text%3E%3C/svg%3E">
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="brand">
      <span class="logo">闻</span>
      <div>
        <h1>央视新闻 · 每日摘要</h1>
        <p class="sub">新闻联播 + 央视财经 · 自动抓取归纳</p>
      </div>
    </div>
    <div class="day-meta" id="dayMeta">加载中…</div>
  </div>
</header>

<nav class="controls">
  <div class="date-strip" id="dateStrip" aria-label="选择日期"></div>
  <div class="control-right">
    <label class="history-btn" title="查看往期">
      📅<input type="date" id="datePick" aria-label="选择往期日期">
    </label>
    <button class="refresh-btn" id="refreshBtn" title="刷新数据">
      <svg id="refreshIcon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      <span>刷新</span>
    </button>
  </div>
</nav>

<nav class="view-switch" id="viewSwitch" aria-label="视图切换">
  <button class="vbtn active" data-view="daily">每日速览</button>
  <button class="vbtn" data-view="archive">往期归类</button>
</nav>

<div class="toolbar" id="toolbar" hidden>
  <div class="search-box">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="searchInput" placeholder="搜索当日新闻…" autocomplete="off">
  </div>
  <div class="src-tabs" id="srcTabs"></div>
  <div class="cat-chips" id="catChips"></div>
</div>

<main id="main">
  <section class="card highlights" id="highlights" hidden>
    <h2 id="hlTitle">⚡ 今日要点</h2>
    <ol id="hlList"></ol>
  </section>

  <section class="news-list" id="newsList"></section>

  <section class="card archive" id="archiveView" hidden>
    <div class="arch-head">
      <h2>📂 往期归类</h2>
      <div class="arch-stats" id="archStats">加载中…</div>
    </div>
    <div class="arch-filters">
      <div class="src-tabs" id="archSrcTabs"></div>
      <div class="cat-chips" id="archCatChips"></div>
    </div>
    <div class="arch-list" id="archList"></div>
  </section>

  <div class="state-msg" id="stateMsg"></div>
</main>

<footer>
  <p>数据来源：<a href="https://tv.cctv.com/lm/xwlb/" target="_blank" rel="noopener">央视网《新闻联播》</a> · <a href="https://tv.cctv.com/lm/jjxxll/" target="_blank" rel="noopener">央视财经《经济信息联播》</a></p>
  <p>GitHub Actions 每天 21:30 自动抓取更新 ｜ 本地规则归纳，无 AI 参与</p>
</footer>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
